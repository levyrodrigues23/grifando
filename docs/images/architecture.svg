<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" aria-labelledby="t d" role="img" viewBox="0 0 960 480"><title id="t">Grifando architecture</title><desc id="d">The browser sends requests with a signed session cookie and, for AI features, the visitor&apos;s own key in a header. On Vercel, proxy.ts verifies the session and sets the CSP, API routes rate-limit and validate, domain services hold the logic, repositories read and write Postgres through Prisma, and the AI provider calls Gemini or Claude with a timeout and one fallback model.</desc><defs><marker id="a" markerHeight="7" markerWidth="7" orient="auto" refX="7" refY="4" viewBox="0 0 8 8"><path fill="#111" d="M0 0 8 4 0 8z"/></marker><marker id="v" markerHeight="7" markerWidth="7" orient="auto" refX="7" refY="4" viewBox="0 0 8 8"><path fill="#0007cb" d="M0 0 8 4 0 8z"/></marker><style>.t{font-family:Inter,&apos;Segoe UI&apos;,Helvetica,Arial,sans-serif;fill:#111}.h{font-size:17px;font-weight:300}.s{font-size:12.5px;fill:#5c5c5c}.m{font-family:&apos;JetBrains Mono&apos;,ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:1.3px;fill:#767676}.card{fill:#fff;stroke:#dedbd6}.key,.ln{fill:none}.ln{stroke:#111;stroke-width:1.2}.key{stroke:#0007cb;stroke-width:1.4}</style></defs><rect width="960" height="480" fill="#faf9f6"/><text x="32" y="44" class="m">HOW A REQUEST FLOWS</text><rect width="190" height="112" x="32" y="112" class="card" rx="4"/><text x="52" y="146" class="t h">Browser</text><text x="52" y="174" class="t s">Signed session cookie</text><text x="52" y="194" class="t s">AI key in localStorage,</text><text x="52" y="211" class="t s">sent only as a header</text><rect width="424" height="372" x="262" y="72" fill="#f1eee9" rx="4"/><text x="282" y="100" class="m">NEXT.JS ON VERCEL</text><rect width="384" height="58" x="282" y="114" class="card" rx="4"/><text x="302" y="140" class="t h">proxy.ts</text><text x="302" y="160" class="t s">verifies the session · CSP nonce · security headers</text><rect width="384" height="58" x="282" y="194" class="card" rx="4"/><text x="302" y="220" class="t h">API routes</text><text x="302" y="240" class="t s">rate limits in Postgres · input validated with Zod</text><rect width="384" height="58" x="282" y="274" class="card" rx="4"/><text x="302" y="300" class="t h">Domain services</text><text x="302" y="320" class="t s">mistake patterns · exercises · mastery · streaks</text><rect width="384" height="58" x="282" y="354" class="card" rx="4"/><text x="302" y="380" class="t h">Repositories · Prisma 7</text><text x="302" y="400" class="t s">every query scoped to the session&apos;s user</text><path marker-end="url(#a)" d="M474 172V191" class="ln"/><path marker-end="url(#a)" d="M474 252V271" class="ln"/><path marker-end="url(#a)" d="M474 332V351" class="ln"/><path marker-end="url(#v)" d="M222 152H279" class="key"/><rect width="198" height="104" x="730" y="114" class="card" rx="4"/><text x="750" y="146" class="t h">AIProvider</text><text x="750" y="172" class="t s">60 s timeout</text><text x="750" y="190" class="t s">one fallback model</text><text x="750" y="208" class="t s">output checked with Zod</text><path marker-end="url(#a)" d="M666 303H700V166H727" class="ln"/><rect width="94" height="44" x="730" y="250" class="card" rx="4"/><text x="777" y="277" class="t s" text-anchor="middle" style="fill:#111">Gemini</text><rect width="94" height="44" x="834" y="250" class="card" rx="4"/><text x="881" y="277" class="t s" text-anchor="middle" style="fill:#111">Claude</text><path marker-end="url(#v)" d="M777 218V247" class="key"/><path marker-end="url(#v)" d="M881 218V247" class="key"/><rect width="198" height="58" x="730" y="354" class="card" rx="4"/><text x="750" y="380" class="t h">Postgres</text><text x="750" y="400" class="t s">Neon · 90-day cleanup</text><path marker-end="url(#a)" d="M666 383H727" class="ln"/><path d="M32 462H64" class="key"/><text x="74" y="466" class="t s">Path of the visitor&apos;s AI key: used for one request, never stored or logged</text></svg>