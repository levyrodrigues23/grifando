name: PR-Agent

# AI review on pull requests, using Gemini through Google AI Studio.
# Uses `pull_request` (not `pull_request_target`): PRs from forks do not get the
# secret and therefore are not reviewed. That is intentional and safe.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr_agent:
    name: Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event.sender.type != 'Bot' &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Check for GEMINI_API_KEY
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::notice::GEMINI_API_KEY is not available (not set, or this is a fork PR); skipping PR-Agent."
            echo "HAS_KEY=false" >> "$GITHUB_ENV"
          else
            echo "HAS_KEY=true" >> "$GITHUB_ENV"
          fi

      - name: PR-Agent
        if: env.HAS_KEY == 'true'
        uses: docker://pragent/pr-agent:0.49.0-github_action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.model: "gemini/gemini-3.5-flash"
          config.fallback_models: '["gemini/gemini-3.5-flash-lite"]'
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "true"
          pr_reviewer.extra_instructions: >-
            Review against the rules in CLAUDE.md. Layering is UI (src/app) -> thin
            API routes -> domain services (src/server/domain) -> repositories ->
            Prisma; route handlers must not hold business logic. All AI calls go
            through the AIProvider interface in src/server/ai/provider.ts, never the
            SDKs directly, and every AI response is validated with its Zod schema
            before it is persisted. A visitor's AI key (x-ai-key header) must never
            be stored, logged, put in a URL or sent to analytics. Every client fetch
            must check response.ok. Do not suggest bumping the pinned versions of
            TypeScript, Prisma or ESLint.
