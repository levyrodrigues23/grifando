services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: english_coach
      POSTGRES_PASSWORD: english_coach
      POSTGRES_DB: english_coach
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U english_coach"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
